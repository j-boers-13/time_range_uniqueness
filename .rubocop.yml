plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Style/Documentation:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - lib/time_range_uniqueness.rb

RSpec/BeforeAfterAll:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Max: 8

RSpec/ExampleLength:
  Max: 8
